# replaces /etc/nginx/conf.d/default.conf in nginx-unprivileged
# (runs as non-root, so it listens on 8080 and compose maps 80 -> 8080)

# Docker's embedded DNS. Looking names up at request time means a
# restarted container (new IP) is found again without reloading nginx
resolver 127.0.0.11 valid=10s ipv6=off;

# keep the caller's X-Request-Id if it sent one, otherwise use nginx's own id.
# every service logs this id, so one click can be traced across all of them:
#   docker compose logs | grep <request-id>
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ''      $request_id;
}

# one JSON object per request, includes which service answered and how long it took
log_format json escape=json '{'
    '"time":"$time_iso8601",'
    '"service":"frontend",'
    '"requestId":"$req_id",'
    '"remoteAddr":"$remote_addr",'
    '"method":"$request_method",'
    '"url":"$request_uri",'
    '"statusCode":$status,'
    '"bytes":$body_bytes_sent,'
    '"durationMs":$request_time,'
    '"upstream":"$upstream_addr",'
    '"upstreamStatus":"$upstream_status",'
    '"upstreamTime":"$upstream_response_time",'
    '"userAgent":"$http_user_agent"'
'}';

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    server_tokens off;
    # the official image links this file to the container's stdout
    access_log /var/log/nginx/access.log json;
    add_header X-Request-Id $req_id always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # common settings for all backend calls
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $req_id;
    # the services echo the id back, nginx adds it itself, so hide theirs
    proxy_hide_header X-Request-Id;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;

    # /api/<service>/<path> -> http://<service>:8080/<path>
    location /api/catalogue/ {
        set $upstream catalogue:8080;
        rewrite ^/api/catalogue/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }
    location /api/user/ {
        set $upstream user:8080;
        rewrite ^/api/user/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }
    location /api/cart/ {
        set $upstream cart:8080;
        rewrite ^/api/cart/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }
    location /api/shipping/ {
        set $upstream shipping:8080;
        rewrite ^/api/shipping/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }
    location /api/payment/ {
        set $upstream payment:8080;
        rewrite ^/api/payment/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }

    # when nginx itself cannot reach a service, answer in JSON like the services do.
    # errors a service returns on its own (its 404, 503...) pass through untouched
    error_page 502 = @bad_gateway;
    error_page 504 = @gateway_timeout;
    location @bad_gateway {
        default_type application/json;
        return 502 '{"message":"service not reachable (502 Bad Gateway from nginx)"}';
    }
    location @gateway_timeout {
        default_type application/json;
        return 504 '{"message":"service did not answer in time (504 Gateway Timeout from nginx)"}';
    }

    # nginx's own health / connection counters
    location = /health {
        stub_status on;
        access_log off;
    }

    # product images, missing ones fall back to the placeholder
    location /images/ {
        expires 1h;
        try_files $uri /images/placeholder.jpg;
    }

    # Vite puts a content hash in these file names, so cache them forever
    location /assets/ {
        # "expires" (not add_header) so the server-level headers above still apply
        expires max;
        try_files $uri =404;
    }

    # React Router handles every other path in the browser
    location / {
        # always revalidate index.html so new releases show up
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
