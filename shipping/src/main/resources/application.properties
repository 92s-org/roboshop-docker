spring.application.name=shipping
server.port=${SHIPPING_SERVER_PORT:8080}
server.shutdown=graceful
# show the reason of ResponseStatusException in error responses
spring.web.error.include-message=always

# MySQL - values come from environment variables in docker-compose
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/cities?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:shipping}
spring.datasource.password=${DB_PASSWORD:RoboShop@1}
# keep trying for 2 minutes while MySQL loads its data on first start
spring.datasource.hikari.initialization-fail-timeout=120000
spring.datasource.hikari.maximum-pool-size=10

# tables already exist (loaded by the mysql image), never change them
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# cart service used by /confirm
cart.endpoint=${CART_ENDPOINT:cart:8080}

# actuator: /actuator/health, /actuator/prometheus ...
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
